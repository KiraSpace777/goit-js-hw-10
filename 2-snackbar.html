  <body>
    <main>
      <div class="container">
        <nav class="nav">
          <a class="nav-logo" href="./index.html" aria-label="Site logo">
            <svg class="nav-logo-icon" width="100" height="30">
              <use href="/goit-js-hw-10/assets/sprite-E8vg0sBb.svg#logo"></use>

          <a class="back-link" href="./index.html">return to main</a>
        </nav>
        <h1 class="main-title nav-item">Snackbar (promise generator)</h1>
        <form class="form">
          <label class="delayLabel">
            Delay (ms)
            <input type="number" name="delay" class="delayInput" required />
          </label>

          <fieldset class="stateFildset">
            <legend class="stateLegend">State</legend>
            <label class="stateLabel">
              <input type="radio" name="state" value="fulfilled" required />
              Fulfilled
            </label>
            <label class="stateLabel">
              <input type="radio" name="state" value="rejected" required />
              Rejected
            </label>
          </fieldset>

          <button type="submit" class="formBtn">Create notification</button>
        </form>
      </div>

    </main>
